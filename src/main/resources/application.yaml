
server:
  port: 8080
  error:
    include-stacktrace: on_param

spring:
  application:
    name: oebs-api-ve
  profiles:
     active: nais
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    hikari:
      maximum-pool-size: 60
      minimum-idle: 20

  jpa:
    hibernate:
      ddl-auto: none
    #properties:
    #  hibernate:
    #    dialect: org.hibernate.dialect.Oracle12cDialect
    show-sql: false
    open-in-view: false

no:
  nav:
    security:
      jwt:
        issuer:
          azure:
            accepted_audience: ${AZURE_ACCEPTED_AUDIENCE}
            discoveryurl: https://login.microsoftonline.com/62366534-1ec3-4962-8869-9b5535279d0b/v2.0/.well-known/openid-configuration
            proxyurl: http://webproxy-nais.nav.no:8088

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

springdoc:
  packagesToScan: no.nav.oebs.restapi.api
  override-with-generic-response: false
  remove-broken-reference-definitions: false
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha

vieri:
  api:
    loadaccounts: https://vieri-api-prod.azure-api.net/vieri-dataloader/LoadAccounts
    loadsuppliers: https://vieri-api-prod.azure-api.net/vieri-dataloader/LoadSuppliers
    loaddimensions: https://vieri-api-prod.azure-api.net/vieri-dataloader/LoadDimensions
  ocp:
    management: ${VIERI_OCP_MANAGEMENT}

oebs:
  environment: OEBSP
  version: 0.7.0
  date: 16.07.2024


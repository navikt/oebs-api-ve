spring:
  application:
    name: oebs-api-ve
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    username: test_user
    password: test_password
    url: jdbc:oracle:thin:@localhost:1521:testdb
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    show-sql: true
    open-in-view: false

vieri:
  api:
    loadaccounts: http://localhost/test/LoadAccounts
    loadsuppliers: http://localhost/test/LoadSuppliers
    loaddimensions: http://localhost/test/LoadDimensions
  ocp:
    management: test-ocp-management

oebs:
  environment: TEST
  version: 0.7.0
  date: 16.07.2024

apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: oebs-api-ve-q2
  namespace: team-oebs
  labels:
    team: team-oebs
spec:
  image: {{ image }}
  port: 8080
  envFrom:
    - secret: oebs-api-ve-q2
    - secret: oebs-api-ve-q2-oracle
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: q2
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: /internal/isalive
    initialDelay: 60
    timeout: 11
  readiness:
    path: /internal/isready
    initialDelay: 60
    timeout: 10
  resources:
    requests:
      cpu: 400m
      memory: 1024Mi
    limits:
      cpu: 4000m
      memory: 2048Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
      allowAllUsers: true

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
     - "https://oebs-api-ve-q2.ekstern.dev.nav.no"
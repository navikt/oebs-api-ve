apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: oebs-api-ve-u1
  namespace: team-oebs
  labels:
    team: team-oebs
spec:
  image: {{ image }}
  port: 8080
  envFrom:
    - secret: oebs-api-ve-t1
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: u1
    - name: APP_NAME
      value: oebs-api-ve-u1
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: /internal/isalive
    initialDelay: 60
    timeout: 10
  readiness:
    path: /internal/isready
    initialDelay: 60
    timeout: 10
  resources:
    requests:
      cpu: 400m
      memory: 1024Mi
    limits:
      cpu: 4000m
      memory: 2048Mi
  azure:
    application:
      enabled: true
      allowAllUsers: true

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
     - "https://oebs-api-ve-u1.dev.intern.nav.no"
